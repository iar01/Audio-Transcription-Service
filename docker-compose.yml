# Run the whole stack with:  docker compose up --build
# Then open http://localhost:8000

x-app: &app
  build: .
  image: volga:latest
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql+psycopg://volga:volga@postgres:5432/volga
    STORAGE_PATH: /data/storage
    HF_HOME: /data/models
  volumes:
    - storage:/data/storage   # audio + transcripts, shared by API and workers
    - models:/data/models     # Whisper model cache, downloaded once
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: volga
      POSTGRES_PASSWORD: volga
      POSTGRES_DB: volga
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volga -d volga"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    command: >
      celery -A workers.celery_app worker
      --loglevel=INFO
      --pool=prefork
      --concurrency=${CELERY_CONCURRENCY:-1}
    depends_on:
      # The API creates the database tables on startup; wait for it.
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
  models:
